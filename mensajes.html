<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08233b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Centro de Mensajes y Chats con Técnicos | Chapa Tu Técnico</title>
    <meta name="title" content="Centro de Mensajes y Chats con Técnicos | Chapa Tu Técnico">
    <meta name="description"
        content="Comunícate en tiempo real con los técnicos asignados a tus solicitudes de servicio para coordinar visitas, presupuestos y consultas directas en Lima.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://dlmediapro.github.io/chapatutecnico-dev/mensajes.html">

    <link rel="icon" type="image/webp" href="img/logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/views/mensajes.css">
</head>

<body data-page="mensajes">

    <!-- Header institucional compartido -->
    <script src="layout.js" data-part="header" defer></script>

    <main class="mensajes-main" id="mensajes-main">
        <div class="container">
            <div class="mensajes-app-layout" id="mensajes-app-layout">
                <!-- Columna Izquierda: Lista de Conversaciones -->
                <aside class="mensajes-sidebar" aria-label="Lista de chats">
                    <div class="sidebar-header-box">
                        <div class="todos-chats-pill" id="todos-chats-pill">
                            <span class="chat-pill-icon" aria-hidden="true">💬</span>
                            <span class="chat-pill-title">Todos los chats</span>
                            <span class="chat-pill-badge" id="badge-total-chats">4</span>
                        </div>
                        <h2 class="sidebar-sub-title">Mis conversaciones</h2>
                    </div>

                    <div class="conversaciones-list" id="conversation-list-container" role="list">
                        <!-- Hidratado dinámicamente con los 4 estados en js/mensajes.js -->
                    </div>
                </aside>

                <!-- Columna Derecha: Hilo de Conversación Activo -->
                <section class="mensajes-chat-pane" aria-label="Conversación actual">
                    <!-- Cabecera del Chat -->
                    <div class="chat-pane-header">
                        <div class="chat-user-info" id="chat-user-info">
                            <div class="avatar-header-wrap" id="chat-header-avatar-wrap">
                                <span class="avatar-header-circle" aria-hidden="true">👤</span>
                            </div>
                            <div class="chat-header-text">
                                <h1 class="chat-header-nombre" id="chat-active-name">Cargando conversación...</h1>
                                <span class="chat-header-status" id="chat-active-status">
                                    <span class="status-dot-green" aria-hidden="true"></span> En línea
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Tarjeta interactiva de Propuesta de Servicio (Aceptar/Rechazar) -->
                    <div class="chat-proposal-container" id="chat-proposal-container" aria-live="polite">
                        <!-- Inyectado dinámicamente si el chat tiene cotización o propuesta -->
                    </div>

                    <!-- Mensajes del Chat -->
                    <div class="chat-messages-container" id="chat-stream" role="log" aria-live="polite">
                        <!-- Hidratado dinámicamente con los 4 estados en js/mensajes.js -->
                    </div>

                    <!-- Input Bar inferior -->
                    <form class="chat-input-bar" id="chat-form">
                        <input type="text" id="mensaje-input" class="chat-text-input" placeholder="Escribe un mensaje..."
                            aria-label="Escribir mensaje" autocomplete="off" required>
                        <button type="submit" id="btn-chat-send" class="btn-chat-send" aria-label="Enviar mensaje">
                            ➤
                        </button>
                        <button type="button" id="btn-chat-mic" class="btn-chat-mic" aria-label="Grabar audio de voz">
                            🎤
                        </button>
                    </form>

                    <!-- Toast accesible de notificaciones temporales -->
                    <div id="chat-toast" class="chat-toast" aria-live="polite" role="status" hidden></div>
                </section>
            </div>
        </div>
    </main>

    <!-- Footer institucional compartido -->
    <script src="layout.js" data-part="footer" defer></script>
    <script src="main.js" defer></script>
    <script src="js/mensajes.js" defer></script>
</body>

</html>
